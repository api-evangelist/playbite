name: Playbite
description: >-
  Playbite is a free mobile arcade app - "an arcade in your pocket" - built by
  Digital Media Technology SL and backed by 500 Global. The app offers an
  ever-expanding library of simple, casual games spanning multiplayer, rhythm,
  puzzle, matching, relaxing, and racing categories, with over 500,000 players
  who play games and earn rewards. The service is free to users and monetized
  through non-intrusive advertising. Playbite is a consumer-facing mobile
  gaming product distributed through the Apple App Store and Google Play; it
  publishes no public developer API, SDK, or developer portal, so this profile
  captures its company identity, public web properties, and domain security
  posture rather than an API surface.
